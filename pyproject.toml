[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vget-agent-toolkit"
version = "0.2.4"
description = "Agent-neutral local objective-to-GenBank-and-HTML toolkit"
requires-python = ">=3.11"
dependencies = ["biopython==1.86", "Flask==3.1.2", "openpyxl==3.1.5"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
vget = "vget.cli:main"

[tool.setuptools.packages.find]
include = ["vget*"]

[tool.setuptools.package-data]
vget = ["static/*", "data/registry/*/*"]
