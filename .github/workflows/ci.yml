name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[test]' wheel
      - name: Test
        run: python -m pytest tests -q
      - name: Check public source hygiene
        run: python scripts/check_public_tree.py
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Verify isolated wheel
        run: |
          python -m venv /tmp/vget-wheel-check
          /tmp/vget-wheel-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/vget-wheel-check/bin/vget tools > /tmp/vget-tools.json
          /tmp/vget-wheel-check/bin/vget --workspace /tmp/vget-offline-check init
